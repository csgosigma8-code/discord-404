<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Tracker - Check Stats & Leaderboards</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0b071e;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        /* Реалистичный задний фон-обманка */
        .fake-bg {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0.4; /* Слегка затемняем, чтобы окно куки выделялось */
            text-align: center;
        }
        .fake-bg h1 {
            color: #fde232;
            font-size: 42px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .fake-bg p {
            color: #fff;
            font-size: 18px;
        }

        /* Баннер Куки на весь экран — ловит клик в любом месте */
        #cookie-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Окно будет снизу, как на тру сайтах */
            z-index: 100;
            cursor: pointer;
        }
        .cookie-box {
            background: #18142c;
            border-top: 3px solid #0078f2;
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }
        .cookie-text {
            color: #ddd;
            font-size: 14px;
            max-width: 70%;
            text-align: left;
            line-height: 1.4;
        }
        .cookie-btn {
            background: #0078f2;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .cookie-btn:hover {
            background: #0061c2;
        }

        /* Полноэкранный скример (изначально скрыт) */
        #screamer-layer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
        }
        #screamer-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Задний фон под сайт-чекер -->
    <div class="fake-bg">
        <h1>Fortnite Tracker</h1>
        <p>Загрузка базы данных игроков и инвентаря...</p>
    </div>

    <!-- Всплывающее окно Cookies -->
    <div id="cookie-overlay">
        <div class="cookie-box">
            <div class="cookie-text">
                Мы используем файлы cookie для персонализации контента, рекламы и анализа трафика трекера Epic Games. Продолжая использовать сайт, вы соглашаетесь с нашей политикой конфиденциальности.
            </div>
            <button class="cookie-btn" id="accept-cookies">Принять все</button>
        </div>
    </div>

    <!-- Слой со скримером -->
    <div id="screamer-layer">
        <!-- Рабочая ссылка на страшного монстра -->
        <img src="https://postimg.cc" alt="Jumpscare">
    </div>

    <!-- Проверенный громкий крик -->
    <audio id="screamerSound" src="https://soundjay.com" preload="auto"></audio>

    <script>
        // Функция активации скримера при клике на куки
        document.getElementById('cookie-overlay').addEventListener('click', function() {
            const layer = document.getElementById('screamer-layer');
            const sound = document.getElementById('screamerSound');
            
            // Включаем звук на полную
            sound.volume = 1.0;
            sound.play().catch(err => console.log("Браузер заблокировал автозвук:", err));
            
            // Моментально выводим монстра на экран
            layer.style.display = 'block';
            
            // Удаляем окно куки, чтобы не мешало
            document.getElementById('cookie-overlay').style.display = 'none';
        });
    </script>
</body>
</html>
