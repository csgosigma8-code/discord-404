<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* Можно заменить на #000 для черного экрана */
            overflow: hidden;
            cursor: pointer;
        }
        /* Полноэкранный скример */
        #screamer-layer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
        }
        #screamer-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Экран со скримером -->
    <div id="screamer-layer">
        <img src="monster.jpg" alt="Jumpscare">
    </div>

    <!-- Звук из репозитория -->
    <audio id="screamerSound" src="scream.mp3" preload="auto"></audio>

    <script>
        // Клик в ЛЮБОМ месте экрана активирует скример и звук
        document.addEventListener('click', function() {
            const layer = document.getElementById('screamer-layer');
            const sound = document.getElementById('screamerSound');
            const docEl = document.documentElement;

            // Полноэкранный режим
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen();
            } else if (docEl.webkitRequestFullscreen) { 
                docEl.webkitRequestFullscreen();
            }
            
            // Звук на максимум
            sound.volume = 1.0; 
            sound.play().catch(err => console.log("Браузер заблокировал звук:", err));
            
            // Показ монстра
            layer.style.display = 'block';
        }, { once: true }); // Сработает только один раз
    </script>
</body>
</html>
